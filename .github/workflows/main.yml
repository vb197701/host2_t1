name: Auto Renew

on:
  schedule:
    - cron: '0,40 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  run-renew:
    name: 执行脚本
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ----------------------------------------------------------------
      # 1. 拉取 B 库自身（用于 KeepAlive 提交）
      # ----------------------------------------------------------------
      - name: 拉取 REPO
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. 拉取私库私有代码
      # ----------------------------------------------------------------
      - name: 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private_script

      # ----------------------------------------------------------------
      # 3. 配置 Python 环境
      # ----------------------------------------------------------------
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ----------------------------------------------------------------
      # 4. 安装系统依赖（含 Chrome）
      # ----------------------------------------------------------------
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      # ----------------------------------------------------------------
      # 5. 安装 Python 依赖
      # ----------------------------------------------------------------
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      # ----------------------------------------------------------------
      # 6. ✅ 安装官方 WARP 客户端（纯 SOCKS5 代理模式，端口 40000）
      #    替代原来的 fscarmen/warp-on-actions，确保 Chrome 代理流量
      #    100% 走 WARP，reCAPTCHA 不再被识别为数据中心 IP
      # ----------------------------------------------------------------
      - name: 安装并启动 WARP（官方 SOCKS5 模式）
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | \
            sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] \
            https://pkg.cloudflareclient.com/ jammy main" | \
            sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect

          echo "⏳ 等待 WARP 隧道建立 (10秒)..."
          sleep 10

          echo "[INFO] WARP SOCKS5 代理 IP 验证:"
          curl -s -x socks5://127.0.0.1:40000 https://api.ipify.org && echo
          echo "[INFO] WARP Trace:"
          curl -s -x socks5://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | \
            grep -E 'ip=|warp=|loc=' || true

      # ----------------------------------------------------------------
      # 7. 执行续订（Chrome 已在 main.py 中配置走 SOCKS5:40000）
      # ----------------------------------------------------------------
      - name: 执行续订
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python private_script/main.py

      # ----------------------------------------------------------------
      # 8. 上传截图
      # ----------------------------------------------------------------
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      # ----------------------------------------------------------------
      # 9. KeepAlive：防止 GitHub 禁用定时任务
      # ----------------------------------------------------------------
      - name: KeepAlive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "最后运行时间: $(date)" > time.txt
          git add time.txt
          if git diff --staged --quiet; then
            echo "没有内容变化，跳过推送。"
          else
            git commit -m "⏰ KeepAlive: $(date +'%Y-%m-%d %H:%M UTC')"
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main --force
          fi

      # ----------------------------------------------------------------
      # 10. 清理历史运行记录
      # ----------------------------------------------------------------
      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
